apiVersion: network.openstack.org/v1beta1
kind: NetConfig
metadata:
  name: openstacknetconfig
  namespace: openstack
spec:
  networks:
  - name: ctlplane
    dnsDomain: ctlplane.example.com
    subnets:
    - name: subnet1
      allocationRanges:
      - end: 192.168.122.120
        start: 192.168.122.100
      - end: 192.168.122.200
        start: 192.168.122.150
      cidr: 192.168.122.0/24
      gateway: 192.168.122.1
      routes:
      - destination: 192.168.123.0/24
        nexthop: 192.168.122.1
      - destination: 192.168.124.0/24
        nexthop: 192.168.122.1
    - name: subnet2
      allocationRanges:
      - end: 192.168.123.120
        start: 192.168.123.100
      - end: 192.168.123.200
        start: 192.168.123.150
      cidr: 192.168.123.0/24
      gateway: 192.168.123.1
      routes:
      - destination: 192.168.122.0/24
        nexthop: 192.168.123.1
      - destination: 192.168.124.0/24
        nexthop: 192.168.123.1
    - name: subnet3
      allocationRanges:
      - end: 192.168.124.120
        start: 192.168.124.100
      - end: 192.168.124.200
        start: 192.168.124.150
      cidr: 192.168.124.0/24
      gateway: 192.168.124.1
      routes:
      - destination: 192.168.122.0/24
        nexthop: 192.168.124.1
      - destination: 192.168.123.0/24
        nexthop: 192.168.124.1
