# Copy to openstack_service_secret.yaml (git-ignored) and replace every CHANGE_ME.
# Passwords: alphanumeric, 32+ chars, e.g. `openssl rand -hex 16`.
# BarbicanSimpleCryptoKEK must be a base64-encoded 32-byte key: `openssl rand -base64 32`.
apiVersion: v1
kind: Secret
metadata:
  name: osp-secret
  namespace: openstack
type: Opaque
stringData:
  AdminPassword: CHANGE_ME
  AodhPassword: CHANGE_ME
  BarbicanPassword: CHANGE_ME
  BarbicanSimpleCryptoKEK: CHANGE_ME
  CeilometerPassword: CHANGE_ME
  CinderPassword: CHANGE_ME
  DbRootPassword: CHANGE_ME
  DesignatePassword: CHANGE_ME
  GlancePassword: CHANGE_ME
  HeatAuthEncryptionKey: CHANGE_ME
  HeatPassword: CHANGE_ME
  IronicInspectorPassword: CHANGE_ME
  IronicPassword: CHANGE_ME
  ManilaPassword: CHANGE_ME
  MetadataSecret: CHANGE_ME
  NeutronPassword: CHANGE_ME
  NovaPassword: CHANGE_ME
  OctaviaHeartbeatKey: CHANGE_ME
  OctaviaPassword: CHANGE_ME
  PlacementPassword: CHANGE_ME
  SwiftPassword: CHANGE_ME
