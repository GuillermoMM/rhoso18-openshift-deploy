# Copy to registry-secret.yaml (git-ignored) and set your registry.redhat.io credentials.
apiVersion: v1
kind: Secret
metadata:
  name: redhat-registry
  namespace: openstack
  labels:
    backup.openstack.org/restore: "true"
    backup.openstack.org/restore-order: "10"
type: Opaque
stringData:
  edpm_container_registry_logins: '{"registry.redhat.io": {"CHANGE_ME_USERNAME": "CHANGE_ME_PASSWORD"}}'
