# Copy to subscription-secret.yaml (git-ignored) and set your Red Hat customer portal credentials.
apiVersion: v1
kind: Secret
metadata:
  name: subscription-manager
  namespace: openstack
  labels:
    backup.openstack.org/restore: "true"
    backup.openstack.org/restore-order: "10"
type: Opaque
stringData:
  rhc_auth: '{"login": {"username": "CHANGE_ME", "password": "CHANGE_ME"}}'
