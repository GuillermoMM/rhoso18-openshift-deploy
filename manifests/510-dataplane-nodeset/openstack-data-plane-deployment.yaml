    nodeTemplate:
      ansible:
        ansiblePort: 22
        ansibleUser: root
        ansibleVars:
          edpm_bootstrap_legacy_network_packages: []
          edpm_bootstrap_packages_bootstrap:
          - driverctl
          - lvm2
          edpm_bootstrap_release_version_package: []
          edpm_ceph_hci_pre_enabled_services:
          - ceph_mon
          - ceph_mgr
          - ceph_osd
          edpm_ceph_hci_pre_storage_ranges:
          - 172.18.0.0/24
          edpm_network_config_template: |
            ---
            {% set mtu_list = [ctlplane_mtu] %}
            {% for network in nodeset_networks %}
            {{ mtu_list.append(lookup('vars', networks_lower[network] ~ '_mtu')) }}
            {%- endfor %}
            {% set min_viable_mtu = mtu_list | max %}
            interfaces:
            - name: eno2
              type: ethernet
              state: up
              mtu: {{ min_viable_mtu }}
            - name: br-ex
              type: ovs-bridge
              state: up
              bridge:
                port:
                - name: eno2
                - name: br-ex
            {% for network in nodeset_networks if network if network != 'tenant' %}
                - name: {{ networks_lower[network] }}
                  vlan:
                    mode: access
                    tag: {{ lookup('vars', networks_lower[network] ~ '_vlan_id') }}
            {% endfor %}
            - name: ens3f0np0
              type: ethernet
              state: up
              mtu: {{ tenant_mtu }}
            - name: ens3f1np1
              type: ethernet
              state: up
              mtu: {{ tenant_mtu }}
            - name: bond-tenant
              type: bond
              state: up
              mtu: {{ tenant_mtu }}
              link-aggregation:
                mode: active-backup
                port:
                  - ens3f0np0
                  - ens3f1np1
            - name: br-tenant
              type: ovs-bridge
              state: up
              bridge:
                port:
                - name: bond-tenant
                - name: br-tenant
                - name: tenant
            - name: {{ neutron_physical_bridge_name }}
              type: ovs-interface
              state: up
              mtu: {{ ctlplane_mtu }}
              ipv4:
                address:
                - ip: {{ ctlplane_ip }}
                  prefix-length: {{ ctlplane_cidr }}
                enabled: true
                dhcp: false
            {% for network in nodeset_networks if network != 'tenant' %}
            - name: {{ networks_lower[network] }}
              type: ovs-interface
              state: up
              mtu: {{ lookup('vars', networks_lower[network] ~ '_mtu') }}
              ipv4:
                address:
                - ip: {{ lookup('vars', networks_lower[network] ~ '_ip') }}
                  prefix-length: {{ lookup('vars', networks_lower[network] ~ '_cidr') }}
                enabled: true
                dhcp: false
            {% endfor %}
            - name: tenant
              type: ovs-interface
              state: up
              mtu: {{ tenant_mtu }}
              controller: br-tenant
              ipv4:
                address:
                - ip: {{ tenant_ip }}
                  prefix-length: {{ tenant_cidr }}
                enabled: true
                dhcp: false
          edpm_network_config_tool: nmstate
          edpm_network_config_tool_nmstate_override: true
          edpm_network_config_update: false
          edpm_ovn_bridge_mappings: datacentre:br-tenant
          edpm_ovn_chassis_type: gateway
          edpm_ovn_encap_network: tenant
          edpm_ovs_packages:
          - openvswitch3.3
          neutron_physical_bridge_mappings:
          - datacentre:br-tenant
          neutron_physical_bridge_name: br-ex
          rhc_release: "9.4"
          rhc_repositories:
          - name: '*'
            state: disabled
          - name: rhel-9-for-x86_64-baseos-eus-rpms
            state: enabled
          - name: rhel-9-for-x86_64-appstream-eus-rpms
            state: enabled
          - name: rhel-9-for-x86_64-highavailability-eus-rpms
            state: enabled
          - name: fast-datapath-for-rhel-9-x86_64-rpms
            state: enabled
          - name: rhceph-7-tools-for-rhel-9-x86_64-rpms
            state: enabled
          - name: rhoso-tools-18-for-rhel-9-x86_64-rpms
            state: enabled
          tenant_mtu: 9000
          timesync_ntp_servers:
          - hostname: 2.rhel.pool.ntp.org
            iburst: true
        ansibleVarsFrom:
        - secretRef:
            name: subscription-manager
        - secretRef:
            name: redhat-registry
