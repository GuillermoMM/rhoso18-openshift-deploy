apiVersion: dataplane.openstack.org/v1beta1
kind: OpenStackDataPlaneNodeSet
metadata:
  name: openstack-data-plane
  namespace: openstack
spec:
  env:
    - name: ANSIBLE_FORCE_COLOR
      value: "True"
  networkAttachments:
    - ctlplane
  preProvisioned: true
  services:
    - redhat
    - download-cache
    - bootstrap
    - configure-network
    - validate-network
    - install-os
    - ceph-hci-pre
    - configure-os
    - ssh-known-hosts
    - run-os
    - reboot-os
    - install-certs
    - ceph-client
    - ovn
    - neutron-metadata
    - libvirt
    - nova
    - telemetry
  nodeTemplate:
    ansibleSSHPrivateKeySecret: dataplane-ansible-ssh-private-key-secret
    extraMounts:
      - extraVolType: Ceph
        volumes:
          - name: ceph
            secret:
              secretName: ceph-conf-files
        mounts:
          - name: ceph
            mountPath: /etc/ceph
            readOnly: true
    managementNetwork: ctlplane
    ansible:
      ansibleUser: root
      ansiblePort: 22
      ansibleVarsFrom:
        - secretRef:
            name: subscription-manager
        - secretRef:
            name: redhat-registry
      ansibleVars:
        timesync_ntp_servers:
          - hostname: 2.rhel.pool.ntp.org
            iburst: true
        rhc_release: "9.4"
        edpm_ceph_hci_pre_storage_ranges:
          - 172.18.0.0/24
        edpm_ceph_hci_pre_enabled_services:
          - ceph_mon
          - ceph_mgr
          - ceph_osd
        # Verify against your subscription: `subscription-manager repos --list` on the host.
        # This host's subscription has no RHOSO 18.0 content repo (only "rhoso-tools-18-*"),
        # so rhoso-release and crudini (adoption-only, unused otherwise) are dropped below.
        rhc_repositories:
          - {name: "*", state: disabled}
          - {name: "rhel-9-for-x86_64-baseos-eus-rpms", state: enabled}
          - {name: "rhel-9-for-x86_64-appstream-eus-rpms", state: enabled}
          - {name: "rhel-9-for-x86_64-highavailability-eus-rpms", state: enabled}
          - {name: "fast-datapath-for-rhel-9-x86_64-rpms", state: enabled}
          - {name: "rhceph-7-tools-for-rhel-9-x86_64-rpms", state: enabled}
          - {name: "rhoso-tools-18-for-rhel-9-x86_64-rpms", state: enabled}
        edpm_bootstrap_release_version_package: []
        # crudini is only used by edpm_pre_adoption_validation (RHOSP 17 adoption); not needed
        # for a fresh install, and not entitled in this subscription. Keep driverctl + lvm2.
        edpm_bootstrap_packages_bootstrap:
          - driverctl
          - lvm2
        # openstack-network-scripts is only for the legacy "network" sysvinit service;
        # unused here since edpm_bootstrap_network_service defaults to NetworkManager.
        edpm_bootstrap_legacy_network_packages: []
        # The wrapper package (rdo-openvswitch/rhoso-openvswitch) isn't entitled on this
        # host; use the versioned fast-datapath package directly. It installs the same
        # openvswitch.service unit that edpm_ovs_services expects.
        edpm_ovs_packages:
          - openvswitch3.3
        neutron_physical_bridge_name: br-ex
        neutron_physical_bridge_mappings:
          - datacentre:br-ex
        edpm_network_config_update: false
        # os-net-config (the default tool) isn't entitled on this host (missing RHOSO content
        # repo). Fall back to the "nmstate" tool directly (linux-system-roles.network),
        # which only needs NetworkManager-ovs/nmstate/openvswitch from base RHEL repos.
        # NOTE: Red Hat marks edpm_network_config_tool=nmstate "experimental, unsupported".
        edpm_network_config_tool: nmstate
        edpm_network_config_tool_nmstate_override: true
        # Single-NIC host: eno2 becomes an OVS bridge (br-ex) directly, no bond. ctlplane is
        # the bridge's untagged internal port; internalapi/storage/tenant are additional
        # internal ports tagged (access mode) with their VLAN ID.
        # Rendered YAML is parsed directly as an nmstate state (top-level "interfaces:").
        # NOTE: unlike os-net-config, the nmstate tool does NOT translate nic1/nic2
        # placeholders via edpm_network_config_os_net_config_mappings, so the real
        # interface name (eno2) is used directly below.
        edpm_network_config_template: |
          ---
          {% set mtu_list = [ctlplane_mtu] %}
          {% for network in nodeset_networks %}
          {{ mtu_list.append(lookup('vars', networks_lower[network] ~ '_mtu')) }}
          {%- endfor %}
          {% set min_viable_mtu = mtu_list | max %}
          interfaces:
          - name: eno2
            type: ethernet
            state: up
            mtu: {{ min_viable_mtu }}
          - name: {{ neutron_physical_bridge_name }}
            type: ovs-bridge
            state: up
            bridge:
              port:
              - name: eno2
              - name: {{ neutron_physical_bridge_name }}
          {% for network in nodeset_networks %}
              - name: {{ networks_lower[network] }}
                vlan:
                  mode: access
                  tag: {{ lookup('vars', networks_lower[network] ~ '_vlan_id') }}
          {% endfor %}
          - name: {{ neutron_physical_bridge_name }}
            type: ovs-interface
            state: up
            mtu: {{ ctlplane_mtu }}
            ipv4:
              address:
              - ip: {{ ctlplane_ip }}
                prefix-length: {{ ctlplane_cidr }}
              enabled: true
              dhcp: false
          {% for network in nodeset_networks %}
          - name: {{ networks_lower[network] }}
            type: ovs-interface
            state: up
            mtu: {{ lookup('vars', networks_lower[network] ~ '_mtu') }}
            ipv4:
              address:
              - ip: {{ lookup('vars', networks_lower[network] ~ '_ip') }}
                prefix-length: {{ lookup('vars', networks_lower[network] ~ '_cidr') }}
              enabled: true
              dhcp: false
          {% endfor %}
  nodes:
    edpm-compute-0:
      hostName: edpm-compute-0
      networks:
      - name: ctlplane
        subnetName: subnet1
        defaultRoute: false
        fixedIP: 192.168.122.100
      - name: internalapi
        subnetName: subnet1
        fixedIP: 172.17.0.100
      - name: storage
        subnetName: subnet1
        fixedIP: 172.18.0.100
      - name: tenant
        subnetName: subnet1
        fixedIP: 172.19.0.100
      ansible:
        ansibleHost: 192.168.122.100
        ansibleUser: root
        ansibleVars:
          fqdn_internal_api: edpm-compute-0.internalapi.example.com
    edpm-compute-1:
      hostName: edpm-compute-1
      networks:
      - name: ctlplane
        subnetName: subnet1
        defaultRoute: false
        fixedIP: 192.168.122.101
      - name: internalapi
        subnetName: subnet1
        fixedIP: 172.17.0.101
      - name: storage
        subnetName: subnet1
        fixedIP: 172.18.0.101
      - name: tenant
        subnetName: subnet1
        fixedIP: 172.19.0.101
      ansible:
        ansibleHost: 192.168.122.101
        ansibleUser: root
        ansibleVars:
          fqdn_internal_api: edpm-compute-1.internalapi.example.com
